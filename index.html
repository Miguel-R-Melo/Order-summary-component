<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <Link rel="icon" type="image/x-icon" href="assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Order Summary Component</title>
</head>
<body>
   <main>
        <div class="container"> 
            <img src="assets/images/illustration-hero.svg" alt="Image person dancing" id="img-dance">
            <h1>Order Summary</h1>
            <p id="desc">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

            <div class="cont-pay">
                <img src="assets/images/icon-music.svg" alt="Music Icon">
                <p>Annual Plan<br>$59.99/year</p>
                <a href="#">Change</a>
            </div>
            
            <button id="pay-button">Proceed to Payment</button>
            <button id="cancel-button">Cancel order</button>
        </div>
   </main> 
</body>
</html>
